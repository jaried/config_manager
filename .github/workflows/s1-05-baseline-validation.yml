name: S1-05 Baseline Validation

on:
  push:
    branches:
      - S1-05-baseline-validation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            PyYAML psutil pytest pytest-asyncio pytest-xdist \
            "git+https://github.com/jaried/is_debug.git"

      - name: Full baseline
        shell: bash
        run: |
          set +e
          python -m pytest -p no:cacheprovider -q tests 2>&1 | tee s1-05-baseline.log
          exit_code=${PIPESTATUS[0]}
          set -e
          echo "BASELINE_PYTEST_EXIT_CODE=$exit_code"
          exit 0
