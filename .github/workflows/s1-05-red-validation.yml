name: S1-05 Red Validation

on:
  push:
    branches:
      - S1-05-red-validation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest

      - name: Verify missing regression asset
        shell: bash
        run: |
          set +e
          python -m pytest -p no:cacheprovider -q \
            tests/01_unit_tests/test_config_manager/test_tc0021_001_progress_autosave_public_chain.py \
            > s1-05-red.log 2>&1
          exit_code=$?
          set -e
          cat s1-05-red.log
          test "$exit_code" -ne 0
          grep -Eqi "file or directory not found|no tests ran|not found" s1-05-red.log
          echo "EXPECTED_PYTEST_EXIT_CODE=$exit_code"
